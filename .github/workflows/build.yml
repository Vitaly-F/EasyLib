name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the C# compiler of .NET Framework
        shell: cmd
        run: build.bat ci
      - name: Tests
        shell: bash
        run: tests/run_tests.sh EasyLib.exe
      - name: Package
        shell: bash
        run: |
          mkdir -p out/EasyLib
          cp EasyLib.exe LICENSE NOTICE.txt dist/README.txt out/EasyLib/
          cd out && 7z a -tzip EasyLib.zip EasyLib >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: EasyLib
          path: out/EasyLib
      - name: Read version
        if: github.ref == 'refs/heads/main'
        id: ver
        shell: bash
        run: echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: EasyLib ${{ steps.ver.outputs.v }}
          files: out/EasyLib.zip
          generate_release_notes: true
