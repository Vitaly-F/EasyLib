name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the C# compiler of .NET Framework
        shell: cmd
        run: build.bat ci
      - name: Tests
        shell: bash
        run: tests/run_tests.sh EasyLib.exe
      - name: Package
        shell: bash
        run: |
          mkdir -p out/EasyLib
          cp EasyLib.exe LICENSE NOTICE.txt dist/README.txt out/EasyLib/
          cd out && 7z a -tzip EasyLib.zip EasyLib >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: EasyLib
          path: out/EasyLib
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/EasyLib.zip
          name: EasyLib ${{ github.ref_name }}
          generate_release_notes: true
